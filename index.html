<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberBoss Splunk Exam Hub</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header class="topbar">
    <h1>CyberBoss Splunk Exam Hub</h1>

    <nav>
        <button data-page="dashboard">Dashboard</button>
        <button data-page="learn">Learn</button>
        <button data-page="lab">SPL Lab</button>
        <button data-page="practice">Practice</button>
        <button data-page="review">Review</button>
    </nav>
</header>

<main>

<section id="dashboard" class="page active">
    <h2>Dashboard</h2>

    <div class="card">
        <h3>Readiness</h3>
        <p id="readiness">0%</p>
    </div>

    <div class="card">
        <h3>XP</h3>
        <p id="xp">0 XP</p>
    </div>
</section>

<section id="learn" class="page">
    <h2>Learn</h2>
    <p>Lessons will appear here.</p>
</section>

<section id="lab" class="page">
    <h2>SPL Lab</h2>
    <p>Search simulator coming soon.</p>
</section>

<section id="practice" class="page">
    <h2>Practice</h2>
    <p>Question banks will appear here.</p>
</section>

<section id="review" class="page">
    <h2>Final Review</h2>
    <p>Checklist and Pocket Reference.</p>
</section>

</main>

<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>
</html>
